name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spamma_ui_e2e
          POSTGRES_USER: spamma
          POSTGRES_PASSWORD: spamma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spamma -d spamma_ui_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: src/Spamma.App/Spamma.App/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Spamma.App/Spamma.App
        run: npm ci

      - name: Build frontend
        working-directory: src/Spamma.App/Spamma.App
        run: npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build app
        run: dotnet build src/Spamma.App/Spamma.App/Spamma.App.csproj --configuration Release

      - name: Prepare data protection key directory
        run: sudo mkdir -p /app/certs/keys && sudo chown -R "$(id -u):$(id -g)" /app/certs

      - name: Install Chromium
        working-directory: src/Spamma.App/Spamma.App
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: src/Spamma.App/Spamma.App
        run: npm run test:e2e
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=spamma_ui_e2e;Username=spamma;Password=spamma
          ConnectionStrings__Redis: 127.0.0.1:6379

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/Spamma.App/Spamma.App/playwright-report/
          retention-days: 14
