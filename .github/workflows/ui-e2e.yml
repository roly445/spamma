name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spamma_ui_e2e
          POSTGRES_USER: spamma
          POSTGRES_PASSWORD: spamma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spamma -d spamma_ui_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: src/Spamma.App/Spamma.App/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Spamma.App/Spamma.App
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: src/Spamma.App/Spamma.App
        run: npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish app
        run: dotnet publish src/Spamma.App/Spamma.App/Spamma.App.csproj --configuration Release --output browser-app

      - name: Prepare data protection key directory
        run: sudo mkdir -p /app/certs/keys && sudo chown -R "$(id -u):$(id -g)" /app/certs

      - name: Build browser test project
        run: dotnet build tests/Spamma.Browser.Tests/Spamma.Browser.Tests.csproj --configuration Release

      - name: Install Chromium for Playwright .NET
        run: pwsh tests/Spamma.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run first-run setup browser tests
        shell: bash
        run: |
          (cd browser-app && exec dotnet Spamma.App.dll) > spamma-setup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5188/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat spamma-setup.log
            exit 1
          fi

          dotnet test tests/Spamma.Browser.Tests/Spamma.Browser.Tests.csproj --configuration Release --no-build --filter "Category=setup&Category!=setup-finalize" --logger "trx;LogFileName=setup-browser-tests.trx" --results-directory browser-test-results
          dotnet test tests/Spamma.Browser.Tests/Spamma.Browser.Tests.csproj --configuration Release --no-build --filter "Category=setup-finalize" --logger "trx;LogFileName=setup-finalize-browser-tests.trx" --results-directory browser-test-results
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5188
          ASPNETCORE_ENVIRONMENT: Production
          SmtpServer__Port: '2526'
          SPAMMA_SETUP_PASSWORD: 'ci-only-setup-password'
          SPAMMA_E2E_RESET_SETUP_CONFIG: 'true'
          SPAMMA_E2E_BASE_URL: http://127.0.0.1:5188
          SPAMMA_BROWSER_RESULTS_DIR: ${{ github.workspace }}/browser-test-results
          SPAMMA_BROWSER_VIDEO_DIR: ${{ github.workspace }}/browser-test-videos
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=spamma_ui_e2e;Username=spamma;Password=spamma
          ConnectionStrings__Redis: 127.0.0.1:6379

      - name: Run browser tests
        shell: bash
        run: |
          (cd browser-app && exec dotnet Spamma.App.dll) > spamma-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5188/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat spamma-app.log
            exit 1
          fi

          dotnet test tests/Spamma.Browser.Tests/Spamma.Browser.Tests.csproj --configuration Release --no-build --filter "(Category=smoke|Category=inbox|Category=campaign|Category=domain|Category=subdomain|Category=user|Category=catch-all|Category=chaos|Category=credential|Category=settings|Category=smtp)&Category!=settings-finalize" --logger "trx;LogFileName=browser-tests.trx" --results-directory browser-test-results
          dotnet test tests/Spamma.Browser.Tests/Spamma.Browser.Tests.csproj --configuration Release --no-build --filter "Category=settings-finalize" --logger "trx;LogFileName=settings-finalize-browser-tests.trx" --results-directory browser-test-results
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5188
          ASPNETCORE_ENVIRONMENT: Production
          Setup__Completed: '2026-01-01T00:00:00Z'
          SmtpServer__Port: '2526'
          SPAMMA_E2E_BASE_URL: http://localhost:5188
          SPAMMA_BROWSER_RESULTS_DIR: ${{ github.workspace }}/browser-test-results
          SPAMMA_BROWSER_VIDEO_DIR: ${{ github.workspace }}/browser-test-videos
          SPAMMA_E2E_APP_CONTENT_ROOT: ${{ github.workspace }}/browser-app
          SPAMMA_E2E_DNS_PORT: '53535'
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=spamma_ui_e2e;Username=spamma;Password=spamma
          ConnectionStrings__Redis: 127.0.0.1:6379

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: |
            browser-test-results/
            spamma-app.log
            spamma-setup.log
          retention-days: 14

      - name: Upload browser scenario videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-scenario-videos
          path: browser-test-videos/*.webm
          if-no-files-found: warn
          retention-days: 14
