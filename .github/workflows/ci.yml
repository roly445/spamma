name: CI

on:
  push:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'src/Spamma.App/Spamma.App/package-lock.json'

      - name: Install frontend dependencies
        working-directory: src/Spamma.App/Spamma.App
        run: npm ci

      - name: Build frontend
        working-directory: src/Spamma.App/Spamma.App
        run: npm run build

      - name: Run frontend unit tests
        working-directory: src/Spamma.App/Spamma.App
        run: npm test

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Clear NuGet cache
        run: dotnet nuget locals all --clear

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Install MinVer CLI
        run: dotnet tool install --global minver-cli

      - name: Get version from MinVer
        id: version
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          VERSION=$(minver --tag-prefix v -v e)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests (excluding E2E)
        run: |
          for project in \
            tests/Spamma.App.Tests/Spamma.App.Tests.csproj \
            tests/Spamma.Modules.DomainManagement.Tests/Spamma.Modules.DomainManagement.Tests.csproj \
            tests/Spamma.Modules.EmailInbox.Tests/Spamma.Modules.EmailInbox.Tests.csproj \
            tests/Spamma.Modules.UserManagement.Tests/Spamma.Modules.UserManagement.Tests.csproj
          do
            name=$(basename "$project" .csproj)
            dotnet test "$project" \
              --configuration Release \
              --logger "trx;LogFileName=${name}.trx" \
              --collect:"XPlat Code Coverage" \
              --results-directory test-results \
              --no-build \
              --verbosity normal
          done
        env:
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: true
          DOTNET_SYSTEM_TEXT_JSON_JSON_SERIALIZER_CACHE_SIZE: 64

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: test-results/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.trx
          check_name: Test Results
